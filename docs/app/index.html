<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1117">
<title>Allenamento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0E1117; color: #F2F4F8; font-family: system-ui, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #hint { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; }
  #hint img { width: 96px; height: 96px; }
  #hint a { color: #FF7A1A; }
</style>
</head>
<body>
<!-- Guscio installabile: icona e schermo intero; l'app vera è su Streamlit Community Cloud. -->
<div id="hint">
  <img src="icon-192.png" alt="">
  <div>Caricamento… se l'app dorme ci vogliono 30-60 secondi.</div>
  <div><a href="https://allenamento-marco.streamlit.app/" target="_blank" rel="noopener">Non si apre? Aprila in Chrome</a></div>
</div>
<iframe src="https://allenamento-marco.streamlit.app/?embed=true"
        allow="screen-wake-lock; autoplay; fullscreen; clipboard-write"
        title="Allenamento"></iframe>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
