<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');
  :root { --bg:#0F1730; --card:#18223F; --line:#2C3A6A; --chip:#24305A; --note:#1F2A4D; --acc:#5AB8FF; --fg:#EEF2FF; --mut:#9DAAD0;
          --done:#1E3B5E; --donefg:#8FD0FF; --dash:#3B4A7E; --warn:#F4B860; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:transparent; color:var(--fg); font-family: 'Outfit', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 2px 1px 4px; }
  button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
  .ic { display:inline-block; vertical-align:-3px; }
  /* serie come chip */
  .chips { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:8px; }
  .chip { position:relative; height:58px; border-radius:14px; border:1px dashed var(--dash); background:transparent; color:var(--mut);
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:0; }
  .chip .k { font-size:16px; font-weight:700; font-variant-numeric: tabular-nums; line-height:1.1; }
  .chip .r { font-size:12px; display:flex; align-items:center; gap:3px; }
  .chip.done { background:var(--done); border:1px solid var(--done); }
  .chip.done .k { color:var(--donefg); }
  .chip.cur { background:var(--acc); border:1px solid var(--acc); color:var(--bg); }
  .chip.cur .k { color:var(--bg); }
  .chip.cur.done { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--acc); }
  .chip .x { position:absolute; top:3px; right:7px; font-size:11px; font-weight:700; color:var(--acc); }
  .chip.cur .x { color:var(--bg); }
  .meta { font-size:13px; color:var(--mut); margin:12px 2px 8px; }
  .meta b { color:var(--fg); font-weight:600; }
  /* stepper kg / rip affiancati */
  .steps { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:10px; }
  .steps.one { grid-template-columns: 1fr; }
  .stp { display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:16px; padding:6px; gap:4px; min-width:0; }
  .stp button { width:46px; height:46px; flex:0 0 46px; border-radius:12px; border:0; background:var(--chip); color:var(--fg); font-size:17px; font-weight:500; }
  .stp button:active { background:#2f3c6e; }
  .stp .v { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; }
  .stp input { width:100%; min-width:0; border:0; background:transparent; color:var(--fg); font-family:inherit; font-size:24px; font-weight:700;
               text-align:center; font-variant-numeric: tabular-nums; padding:0; height:30px; -moz-appearance:textfield; }
  .stp input::-webkit-outer-spin-button, .stp input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .stp input:focus { outline:none; }
  .stp span { font-size:11px; color:var(--mut); }
  .stp .fixed { font-size:24px; font-weight:700; height:30px; line-height:30px; }
  .ok { width:100%; height:56px; margin-top:12px; border:0; border-radius:18px; background:var(--acc); color:var(--bg); font-size:18px; font-weight:700;
        display:flex; align-items:center; justify-content:center; gap:8px; }
  .ok:active { filter:brightness(.92); }
  .ok.upd { background:var(--chip); color:var(--fg); }
  .row2 { display:flex; gap:8px; margin-top:8px; }
  .row2 button { flex:1; height:42px; border-radius:14px; border:0; background:var(--chip); color:var(--mut); font-size:14px; font-weight:500; }
  .alldone { text-align:center; padding:12px 6px 2px; color:var(--donefg); font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; }
  /* timer EMOM */
  .em { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:12px 14px; display:flex; gap:12px; align-items:center; }
  .em .t { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; min-width:86px; text-align:center; color:var(--acc); }
  .em .i { flex:1; min-width:0; } .em .m { font-size:13px; color:var(--mut); }
  .em .n { font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .em .nx { font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .em button { height:50px; min-width:84px; border-radius:16px; border:0; background:var(--acc); color:var(--bg); font-size:16px; font-weight:700; }
  .em button.s { background:var(--chip); color:var(--fg); }
  .bridge { font-size:12px; color:var(--mut); padding:2px 4px; }
  .bridge b { color:var(--fg); }
</style>
<script src="./shared.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";
  const L = window.AllenLib;
  const root = document.getElementById("root");
  let A = null;            // ultimi argomenti ricevuti
  let sel = null;          // indice serie selezionata (0-based)
  let edit = null;         // {kg, reps} valori nell'editor
  let lastSent = {};       // id evento → ms ultimo invio
  let mounted = false, pingTimer = null, resendTimer = null;

  function fmt(v) {
    if (v === null || v === undefined || v === "") return "–";
    const f = Number(v);
    return Number.isInteger(f) ? String(f) : String(Math.round(f * 100) / 100);
  }
  const IC = {
    check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',
  };
  function ico(n, sz) {
    return '<svg class="ic" width="' + (sz || 14) + '" height="' + (sz || 14) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>';
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // ================================================================ modalità SERIE
  function myEvents() {
    return L.outbox().filter(e => e.draftId === A.draftId && e.exKey === A.exKey);
  }
  // stato = argomenti del server + eventi ancora in coda sul telefono (più recenti)
  function mergedSets() {
    const sets = (A.sets || []).map(s => Object.assign({}, s));
    const evs = myEvents().sort((a, b) => a.t - b.t);
    for (const e of evs) {
      if (e.type === "add") {
        while (sets.length < e.n) { const p = sets[sets.length - 1] || {}; sets.push({ n: sets.length + 1, kg: p.kg, reps: p.reps, done: false, t: 0, extra: true }); }
      } else if (e.type === "remove") {
        if (sets.length === e.n && !sets[sets.length - 1].done) sets.pop();
      } else if (e.type === "set") {
        while (sets.length < e.n) { const p = sets[sets.length - 1] || {}; sets.push({ n: sets.length + 1, kg: p.kg, reps: p.reps, done: false, t: 0, extra: true }); }
        const s = sets[e.n - 1];
        if (e.t > (s.t || 0)) { s.kg = e.kg; s.reps = e.reps; s.done = e.done; s.t = e.t; s.local = true; }
      }
    }
    return sets;
  }
  function cleanupAcked() {
    const ack = A.ackT || {};
    const n = (A.sets || []).length;
    const list = L.outbox();
    const keep = list.filter(e => {
      if (e.draftId !== A.draftId || e.exKey !== A.exKey) return true;
      if (!A.synced) return true;
      if (e.type === "set") return !(ack[String(e.n)] >= e.t);
      if (e.type === "add") return n < e.n;
      if (e.type === "remove") return n >= e.n;
      return false;
    });
    if (keep.length !== list.length) L.saveOutbox(keep);
  }
  function unsent() {
    // eventi che il server non ha ancora applicato
    const known = {};
    (A.sets || []).forEach(s => { known[s.n] = s.t || 0; });
    const n = (A.sets || []).length;
    return myEvents().filter(e => {
      if (e.type === "set") return (known[e.n] || 0) < e.t;
      if (e.type === "add") return n < e.n;
      if (e.type === "remove") return n >= e.n;
      return false;
    });
  }
  function sendPending(force) {
    const list = unsent();
    if (!list.length) return;
    const now = Date.now();
    const due = list.filter(e => force || !lastSent[e.id] || now - lastSent[e.id] > 4000);
    if (!due.length) {
      clearTimeout(resendTimer);
      resendTimer = setTimeout(() => sendPending(false), 4200);
      return;
    }
    list.forEach(e => { lastSent[e.id] = now; });
    L.setValue({ events: list, nonce: now });
    clearTimeout(resendTimer);
    resendTimer = setTimeout(() => sendPending(false), 4200);
  }
  function emit(ev) {
    ev.draftId = A.draftId; ev.exKey = A.exKey; ev.t = Date.now();
    ev.id = [A.draftId, A.exKey, ev.type, ev.n, ev.t].join("|");
    L.pushEvent(ev);              // 1) prima sul telefono
    lastSent[ev.id] = 0;
    sendPending(true);            // 2) poi al server (→ GitHub)
  }
  function selectDefault(sets) {
    const i = sets.findIndex(s => !s.done);
    return i === -1 ? null : i;
  }
  function setEditFrom(s) { edit = { kg: s.kg, reps: s.reps }; }

  function renderSets() {
    const sets = mergedSets();
    if (sel === null || sel >= sets.length) { sel = selectDefault(sets); edit = null; }
    if (sel !== null && !edit) setEditFrom(sets[sel]);
    const ack = A.ackT || {};
    const showKg = A.kgMode !== "none";
    const unit = A.unit || "rip";
    let h = '<div class="chips" style="grid-template-columns: repeat(' + (sets.length >= 2 && sets.length <= 5 ? sets.length : 4) + ', minmax(0, 1fr))">';
    sets.forEach((s, i) => {
      const synced = s.done && A.synced && ack[String(s.n)] >= (s.t || 0) && !s.local;
      const kgOk = showKg && s.kg !== null && s.kg !== undefined && !(A.kgMode === "bw" && !Number(s.kg));
      const top = kgOk ? fmt(s.kg) : fmt(s.reps);
      const bot = kgOk ? "× " + fmt(s.reps) : esc(unit);
      const st = s.done ? (synced ? ico("check", 13) : ico("timer", 13)) : "";
      const cls = "chip" + (s.done ? " done" : "") + (i === sel ? " cur" : "");
      const tip = s.done ? (synced ? "salvata" : "sul telefono, in invio") : "da fare";
      h += '<button class="' + cls + '" data-i="' + i + '" aria-label="Serie ' + s.n + ', ' + tip + '">' + (s.extra ? '<span class="x">+</span>' : '') +
        '<span class="k">' + top + '</span><span class="r">' + bot + (st ? " " + st : "") + '</span></button>';
    });
    h += '</div>';
    if (sel !== null) {
      const s = sets[sel];
      if (A.kgMode === "vest") edit.kg = s.kg;
      const pk = s.prev ? s.prev.kg : null;
      const prev = s.prev ? ((showKg && pk !== null && pk !== undefined && !(A.kgMode === "bw" && Number(pk) === 0) ? fmt(pk) + "×" : "") + fmt(s.prev.reps)) : null;
      h += '<div class="meta">Serie <b>' + s.n + '</b> di ' + sets.length + (prev ? ' · prec. <b>' + prev + '</b>' : '') +
        (s.extra ? " · extra" : "") + (s.done ? " · già fatta: puoi correggerla" : "") + '</div>';
      h += '<div class="steps' + (showKg ? '' : ' one') + '">';
      if (A.kgMode === "vest") {
        h += '<div class="stp"><div class="v"><div class="fixed">' + fmt(s.kg) + '</div><span>kg giubbotto</span></div></div>';
      } else if (showKg) {
        h += '<div class="stp"><button data-a="kg-" aria-label="Meno ' + fmt(A.kgStep) + ' kg">−' + fmt(A.kgStep) + '</button>' +
          '<div class="v"><input id="kg" type="number" inputmode="decimal" step="' + A.kgStep + '" min="0" value="' + (edit.kg ?? "") + '"><span>' + (A.kgMode === "bw" ? "kg zavorra" : "kg") + '</span></div>' +
          '<button data-a="kg+" aria-label="Più ' + fmt(A.kgStep) + ' kg">+' + fmt(A.kgStep) + '</button></div>';
      }
      h += '<div class="stp"><button data-a="r-" aria-label="Meno 1">−1</button>' +
        '<div class="v"><input id="reps" type="number" inputmode="numeric" step="1" min="0" value="' + (edit.reps ?? "") + '"><span>' + esc(unit) + '</span></div>' +
        '<button data-a="r+" aria-label="Più 1">+1</button></div></div>';
      const lab = s.done ? "Aggiorna serie " + s.n : (A.restSec ? "Fatta, avvia recupero" : "Fatta");
      h += '<button class="ok' + (s.done ? " upd" : "") + '" data-a="ok">' + lab + '</button>';
      h += '<div class="row2">' + (s.done ? '<button data-a="undo">Segna non fatta</button>' : '') +
        (A.canAdd !== false ? '<button data-a="add">+ Serie extra</button>' : '') +
        (sets.length > 1 && sel === sets.length - 1 && !s.done ? '<button data-a="rm">− Togli serie</button>' : '') + '</div>';
    } else {
      h += '<div class="alldone">' + ico("check", 18) + 'Tutte le serie fatte · tocca una serie per correggerla</div>';
      if (A.canAdd !== false) h += '<div class="row2"><button data-a="add">+ Serie extra</button></div>';
    }
    root.innerHTML = h;
    L.setHeight(Math.ceil(root.getBoundingClientRect().height) + 6);
    maybeReveal();
  }

  // dopo "Fatta": se questo è l'esercizio che viene dopo, il suo tasto "Fatta" deve restare sopra il pannello del recupero
  function maybeReveal(tries) {
    let R = null;
    try { R = window.parent.__allenRest; } catch (e) { return; }
    if (!R || !R.wantsReveal || !R.wantsReveal(A.exKey)) return;
    setTimeout(function () {
      const ok = document.querySelector(".ok");
      let fr = null;
      try { fr = window.frameElement && window.frameElement.getBoundingClientRect(); } catch (e) {}
      if (!ok || !fr) return;
      // aspetta che Streamlit abbia dato all'iframe l'altezza giusta
      if (fr.height < root.getBoundingClientRect().height - 2 && (tries || 0) < 6) { maybeReveal((tries || 0) + 1); return; }
      const r = ok.getBoundingClientRect();
      R.reveal(fr.top + r.top, fr.top + r.bottom);
    }, 250);
  }

  // "Poi: …" nel pannello del timer. Fuori dai superset la prossima è la serie successiva di questo esercizio.
  function nextInfo(n) {
    const nx = A.next || {};
    if (nx.code || nx.name) return nx;
    const sets = mergedSets();
    const s = sets.find(x => !x.done && x.n !== n);
    if (!s) return { name: "Fine esercizio", code: "", set: null, reps: "", key: null };
    return { key: A.exKey, code: A.code || "", name: A.name || "", set: s.n, reps: "× " + fmt(s.reps) + ((A.unit || "rip") === "rip" ? "" : " " + A.unit) };
  }

  function readInputs() {
    const kg = document.getElementById("kg"), reps = document.getElementById("reps");
    if (kg && kg.value !== "") edit.kg = Math.max(0, Number(String(kg.value).replace(",", ".")));
    if (reps && reps.value !== "") edit.reps = Math.max(0, Math.round(Number(reps.value)));
  }

  root.addEventListener("input", function () { if (A && A.mode === "sets" && edit) readInputs(); });
  root.addEventListener("click", function (e) {
    if (!A) return;
    if (A.mode !== "sets") return;
    const t = e.target.closest("[data-a],.chip");
    if (!t) return;
    const sets = mergedSets();
    if (t.matches(".chip")) { sel = Number(t.getAttribute("data-i")); setEditFrom(sets[sel]); renderSets(); return; }
    const a = t.getAttribute("data-a");
    if (edit) readInputs();
    const step = Number(A.kgStep || 2.5);
    // ± porta sempre al multiplo del passo (es. 102,5 → 105 / 100 col bilanciere a passi di 5)
    const q = (Number(edit.kg) || 0) / step;
    if (a === "kg-") edit.kg = Math.max(0, Math.round((Math.ceil(q - 1e-6) - 1) * step * 100) / 100);
    if (a === "kg+") edit.kg = Math.round((Math.floor(q + 1e-6) + 1) * step * 100) / 100;
    if (a === "r-") edit.reps = Math.max(0, (Number(edit.reps) || 0) - 1);
    if (a === "r+") edit.reps = (Number(edit.reps) || 0) + 1;
    if (a === "ok") {
      const s = sets[sel];
      const wasDone = s.done;
      emit({ type: "set", n: s.n, kg: A.kgMode === "none" ? null : (A.kgMode === "vest" ? s.kg : edit.kg), reps: edit.reps, done: true });
      if (!wasDone && A.restSec) L.startRest(A.restSec, A.restLabel, { sound: A.sound, vibrate: A.vibrate, wakeLock: A.wakeLock, next: nextInfo(s.n), started: true });
      sel = null; edit = null;
    }
    if (a === "undo") { const s = sets[sel]; emit({ type: "set", n: s.n, kg: s.kg, reps: s.reps, done: false }); }
    if (a === "add") { emit({ type: "add", n: sets.length + 1 }); sel = sets.length; edit = { kg: (sets[sets.length - 1] || {}).kg, reps: (sets[sets.length - 1] || {}).reps }; }
    if (a === "rm") { emit({ type: "remove", n: sets.length }); sel = null; edit = null; }
    renderSets();
  });

  // ================================================================ modalità BRIDGE
  // Copia della bozza sul telefono + reinvio della coda + ping per ritentare GitHub.
  function renderBridge() {
    const DK = "allen_draft_v1";
    if (!mounted) {
      mounted = true;
      L.installTimer();
      const stored = L.lsGet(DK, null);
      const caps = (window.parent.__allenRest || {}).caps || {};
      L.setValue({ type: "mount", stored: stored, outbox: L.outbox(), caps: caps, nonce: Date.now() });
    }
    if (A.clear) {
      if (!A.draftId) { try { L.lsDel("allen_rest"); } catch (e) {} }
      const st = L.lsGet(DK, null);
      if (st && st.id === A.clear) L.lsDel(DK);
      L.saveOutbox(L.outbox().filter(e => e.draftId !== A.clear));
    }
    if (A.draft) {
      const st = L.lsGet(DK, null);
      if (!st || st.id !== A.draft.id || (A.draft.rev || 0) >= (st.rev || 0)) L.lsSet(DK, A.draft);
    }
    // pulizia degli eventi già salvati su GitHub
    if (A.draftId && A.synced) {
      const ack = A.ackT || {};
      const list = L.outbox();
      const keep = list.filter(e => !(e.draftId === A.draftId && e.type === "set" && ack[e.exKey + "|" + e.n] >= e.t));
      if (keep.length !== list.length) L.saveOutbox(keep);
    }
    // reinvio di ciò che il server non ha (es. dopo una riconnessione)
    let resend = [];
    if (A.draftId) {
      const known = A.known || {};
      resend = L.outbox().filter(e => e.draftId === A.draftId && e.type === "set" && (known[e.exKey + "|" + e.n] || 0) < e.t);
      const now = Date.now();
      const due = resend.filter(e => !lastSent[e.id] || now - lastSent[e.id] > 5000);
      if (due.length) {
        resend.forEach(e => { lastSent[e.id] = now; });
        L.setValue({ type: "events", events: resend, nonce: now });
      }
    }
    clearTimeout(pingTimer);
    if (A.pendingServer > 0 || resend.length) {
      pingTimer = setTimeout(() => L.setValue({ type: "ping", nonce: Date.now() }), A.retryMs || 12000);
    }
    const q = L.outbox().filter(e => !A.draftId || e.draftId === A.draftId).length;
    root.innerHTML = A.visible === false ? "" :
      '<div class="bridge">Copia sul telefono: <b>' + (A.draft || L.lsGet(DK, null) ? "ok" : "–") + '</b> · in coda: <b>' + q + '</b></div>';
    L.setHeight(A.visible === false ? 0 : Math.ceil(root.getBoundingClientRect().height) + 4);
  }

  window.addEventListener("online", function () { if (A && A.mode === "bridge") L.setValue({ type: "ping", nonce: Date.now() }); else if (A) sendPending(true); });

  // ================================================================ modalità EMOM
  // Timer a intervalli di 1': a ogni minuto completato spunta da solo l'esercizio di quel minuto.
  let emIv = null, emLast = -1, emCtx = null, emSentDone = -1;
  function emGet() { return L.lsGet(A.lsKey, null); }
  function emBeep(n) {
    try {
      if (!emCtx) return;
      for (let i = 0; i < n; i++) {
        const o = emCtx.createOscillator(), g = emCtx.createGain(), t = emCtx.currentTime + i * 0.3;
        o.frequency.value = i === n - 1 ? 1175 : 880;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g); g.connect(emCtx.destination); o.start(t); o.stop(t + 0.25);
      }
    } catch (e) {}
  }
  function emFmt(s) { const m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }
  function emTick() {
    const names = A.names || [], N = names.length || 1, tot = (A.minutes || 10) * 60, v = emGet();
    let t = emFmt(tot), m = "EMOM " + A.minutes + "' · tocca Avvia", n = names[0] || "", nx = "", lab = "Avvia", cls = "";
    let done = 0;
    if (v) {
      const el = Math.floor((Date.now() - v.start) / 1000);
      lab = "Stop"; cls = "s";
      if (el >= tot) {
        t = "Fine"; m = "Riscaldamento completato"; n = ""; lab = "Reset"; done = A.minutes;
        if (emLast !== -2) { emLast = -2; emBeep(3); try { navigator.vibrate && navigator.vibrate([400, 150, 400]); } catch (e) {} }
      } else {
        const mi = Math.floor(el / 60), left = 60 - (el % 60);
        done = mi;
        t = emFmt(left); m = "Minuto " + (mi + 1) + "/" + A.minutes + " · giro " + (Math.floor(mi / N) + 1);
        n = names[mi % N]; nx = "Poi: " + (names[(mi + 1) % N] || "");
        if (mi !== emLast) { if (emLast >= 0) { emBeep(2); try { navigator.vibrate && navigator.vibrate([250, 100, 250]); } catch (e) {} } emLast = mi; }
      }
    }
    root.innerHTML = '<div class="em"><div class="t">' + t + '</div><div class="i"><div class="m">' + esc(m) +
      '</div><div class="n">' + esc(n) + '</div><div class="nx">' + esc(nx) + '</div></div><button class="' + cls + '" data-em="1">' + lab + '</button></div>';
    L.setHeight(Math.ceil(root.getBoundingClientRect().height) + 6);
    if (done > emSentDone && done > 0) { emSentDone = done; L.setValue({ type: "emom", done: done, nonce: Date.now() }); }
  }
  root.addEventListener("click", function (e) {
    if (!A || A.mode !== "emom" || !e.target.closest("[data-em]")) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    try { if (!emCtx && AC) emCtx = new AC(); emCtx && emCtx.resume(); } catch (er) {}
    if (emGet()) { L.lsDel(A.lsKey); emLast = -1; emSentDone = -1; } else { L.lsSet(A.lsKey, { start: Date.now() }); emLast = 0; emBeep(1); }
    emTick();
  });

  // ================================================================ modalità AUTH
  // Token del dispositivo nel localStorage: inviato all'avvio, scritto dopo il login.
  let authSent = false;
  function renderAuth() {
    const K = "allen_device_token_v1";
    if (A.clear) L.lsDel(K);
    if (A.set) L.lsSet(K, A.set);
    if (!authSent) {
      authSent = true;
      L.setValue({ type: "auth", token: A.clear ? null : L.lsGet(K, null), nonce: Date.now() });
    }
    root.innerHTML = "";
    L.setHeight(0);
  }

  L.onRender(function (args) {
    A = args;
    if (A.mode === "auth") { renderAuth(); return; }
    if (A.mode === "emom") { if (!emIv) emIv = setInterval(emTick, 250); emTick(); return; }
    if (A.mode === "bridge") { renderBridge(); return; }
    cleanupAcked();
    renderSets();
    sendPending(false);
  });
})();
</script>
</body>
