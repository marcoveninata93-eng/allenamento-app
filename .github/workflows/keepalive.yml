name: Tieni sveglia l'app

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa Playwright
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Visita l'app
        run: python scripts/keepalive.py
